name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Builds the zip and creates the GitHub Release. Uploads to CurseForge only
      # when CF_API_KEY is set AND Spoils.toc carries an X-Curse-Project-ID line;
      # without them it logs a skip and still succeeds.
      - name: Package and release
        uses: BigWigsMods/packager@master
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
